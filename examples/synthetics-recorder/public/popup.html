<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Synthetics Recorder</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    width: 320px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    background: #ffffff;
    color: #1e1e2e;
  }
  .head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid #e4e4ea;
  }
  .head img { width: 24px; height: 24px; }
  .title { font-weight: 600; }
  .sub { font-size: 11px; opacity: 0.6; }
  .body { padding: 14px 16px; }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    background: #95a5a6;
  }
  .dot.ok { background: #2ecc71; }
  .dot.warn { background: #f39c12; }
  .dot.busy { background: #e74c3c; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .hint { margin: 0; opacity: 0.75; }
  button {
    margin-top: 12px;
    width: 100%;
    padding: 7px 10px;
    border: none;
    border-radius: 6px;
    background: #4b5cc4;
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .foot {
    padding: 10px 16px;
    border-top: 1px solid #e4e4ea;
    font-size: 11px;
  }
  .foot a { color: #4b5cc4; }
  @media (prefers-color-scheme: dark) {
    body { background: #1e1e2e; color: #cdd6f4; }
    .head, .foot { border-color: #45475a; }
    .foot a { color: #8aa5ff; }
  }
</style>
</head>
<body>
  <div class="head">
    <img src="icons/icon-48.png" alt="">
    <div>
      <div class="title">Synthetics Recorder</div>
      <div class="sub">OpenObserve</div>
    </div>
  </div>
  <div class="body">
    <div class="status"><span id="dot" class="dot"></span><span id="status">Checking…</span></div>
    <p id="hint" class="hint"></p>
    <button id="connect" hidden>Connect to this tab</button>
    <button id="incognito" hidden>Open extension settings</button>
  </div>
  <div class="foot">
    <a href="https://openobserve.ai/legal/privacy-policy/" target="_blank" rel="noreferrer noopener">Privacy policy</a>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
