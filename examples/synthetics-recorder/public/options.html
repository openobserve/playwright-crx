<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenObserve Synthetics Recorder — Trusted Origins</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      max-width: 600px;
      margin: 0 auto;
      color: #1e1e2e;
      background: #fff;
    }
    h1 { font-size: 18px; margin-bottom: 16px; }
    .info {
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .info code {
      background: #f0f0f0;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 12px;
    }
    .trusted-list { list-style: none; padding: 0; }
    .trusted-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      margin-bottom: 8px;
      background: #f5f5f5;
      border-radius: 8px;
      border: 1px solid #e5e5e5;
    }
    .trusted-item span { word-break: break-all; font-size: 14px; }
    .trusted-item button {
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
      flex-shrink: 0;
      margin-left: 12px;
    }
    .trusted-item button:hover { background: #c0392b; }
    .empty { color: #999; font-style: italic; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Trusted Origins</h1>
  <p class="info">
    These origins are allowed to control the synthetics recorder.
    Pre-trusted origins (<code>*.openobserve.ai</code>, <code>localhost</code>)
    are not listed here and always have access.
    Revoking a trust grant requires re-approval on the next visit.
  </p>
  <ul id="trustedList" class="trusted-list"></ul>
  <script src="options.js" type="module"></script>
</body>
</html>
